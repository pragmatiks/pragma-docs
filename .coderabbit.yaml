language: "en-US"
early_access: true
tone_instructions: "Documentation review. Focus on accuracy, clarity, and completeness. Flag broken links and outdated examples."

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  related_issues: false
  related_prs: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_filters:
    - "!.gitbook/**"
    - "!**/*.lock"

  path_instructions:
    - path: "**/*.mdx"
      instructions: |
        Mintlify documentation pages. Review for:
        - Technical accuracy of code examples
        - Correct CLI command syntax (must match pragma-cli)
        - Consistent terminology (resource, provider, spec, config)
        - Broken or placeholder links
        - Missing prerequisites or context for guides
    - path: "api-reference/**"
      instructions: |
        API reference docs. Verify endpoint descriptions match the actual API behavior.
        Check request/response examples for correctness.

  tools:
    ruff:
      enabled: false
    eslint:
      enabled: false
    shellcheck:
      enabled: false
    semgrep:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
  pull_requests:
    scope: "auto"
